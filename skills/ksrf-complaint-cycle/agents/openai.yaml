interface:
  display_name: "КС РФ: помощь заявителю"
  short_description: "Разбор дела, исследование, проект жалобы и дальнейшие шаги"
  default_prompt: "Используй $ksrf-complaint-cycle. Начни с того, что я рассказал или приложил: сам разбери материалы и проверь доступные инструменты. Объясни простыми словами, что установлено, чего не хватает и какой следующий шаг нужен. Исследуй варианты и подготовь отдельный рабочий проект, если я прошу написать документ. Не требуй JSON или команд; юридическое одобрение, подписание, платёж и подача остаются за человеком."
